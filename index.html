<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kisshi apps</title>
<style>
  :root { --fg: #222; --bg: #fff; --muted: #666; --card: #f5f5f7; --link: #0a66c2; }
  @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #111; --muted: #aaa; --card: #1c1c1e; --link: #6cb4ff; } }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; max-width: 680px; margin: 0 auto; padding: 48px 16px; line-height: 1.7; color: var(--fg); background: var(--bg); }
  h1 { margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  section { background: var(--card); border-radius: 14px; padding: 20px 22px; margin-bottom: 20px; }
  h2 { margin: 0 0 6px; font-size: 1.3em; }
  p { margin: 0 0 10px; }
  ul { margin: 0; padding-left: 1.2em; }
  a { color: var(--link); }
</style>
</head>
<body>
<h1>kisshi apps</h1>
<p class="lead">個人で開発している iOS アプリのページです。</p>

<section id="machirun">
  <h2>MachiRun</h2>
  <p>距離を決めるだけで、街ランのルートを自動で作るランニングアプリ。</p>
  <ul>
    <li><a href="https://apps.apple.com/jp/app/machirun/id6758909889">App Store</a></li>
    <li><a href="https://ablaze-olivine-d3f.notion.site/39e66acbeae1805f8307c062d19d422c">プライバシーポリシー・サポート</a></li>
    <li><a href="https://ablaze-olivine-d3f.notion.site/39e66acbeae18084935cde482807cc1c">利用規約</a></li>
  </ul>
</section>

<section id="yurumove">
  <h2>yurumove</h2>
  <p>デスクワークや勉強中に、軽い運動を促すリマインダーアプリ。</p>
  <ul>
    <li><a href="https://apps.apple.com/jp/app/yurumove/id6758260270">App Store</a></li>
    <li><a href="https://www.notion.so/2f366acbeae180889e1dfa5bc69febe1">プライバシーポリシー・サポート</a></li>
  </ul>
</section>
</body>
</html>
